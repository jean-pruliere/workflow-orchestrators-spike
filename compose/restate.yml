name: wos-restate

include:
  - stub.yml

x-app: &app
  image: wos-app:dev
  init: true
  command: ["node", "src/engines/restate/main.ts"]

x-env: &env
  STUB_URL: http://stub:8080
  STEP_DELAY_MS: ${STEP_DELAY_MS:-0}
  ENCRYPT: ${ENCRYPT:-0}
  PAYLOAD_KEY: ${PAYLOAD_KEY:-}
  MARKER: ${MARKER:-MARKER}
  WORKFLOW_VERSION: ${WORKFLOW_VERSION:-1}

services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.8.0@sha256:2614a4e3a2102ef0cd4733e324574ee29a77e19e7e29262fa5660c9c55df70e5
    environment:
      RESTATE_NODE_NAME: restate-1
  a:
    <<: *app
    environment: { <<: *env, ROLE: a }
  b:
    <<: *app
    environment: { <<: *env, ROLE: b }
  c:
    <<: *app
    environment: { <<: *env, ROLE: c }
  a-v2:
    <<: *app
    profiles: [v2]
    environment: { <<: *env, ROLE: a }
  restate-register:
    image: wos-app:dev
    init: true
    depends_on: [restate, a, b, c]
    command: ["node", "src/engines/restate/register.ts"]
    environment: { RESTATE_ADMIN: http://restate:9070, TARGETS: "a b c" }
  driver:
    image: wos-app:dev
    init: true
    profiles: [driver]
    command: ["node", "src/driver/run.ts"]
    environment:
      <<: *env
      ENGINE: restate
      RESTATE_INGRESS: http://restate:8080
      RESTATE_ADMIN: http://restate:9070
    volumes: ["../results:/app/results"]
