name: wos-none

include:
  - stub.yml

x-app: &app
  image: wos-app:dev
  init: true
  command: ["node", "src/engines/none/main.ts"]

x-env: &env
  STUB_URL: http://stub:8080
  STEP_DELAY_MS: ${STEP_DELAY_MS:-0}

services:
  a:
    <<: *app
    environment: { <<: *env, ROLE: a }
  b:
    <<: *app
    environment: { <<: *env, ROLE: b }
  c:
    <<: *app
    environment: { <<: *env, ROLE: c }
  driver:
    image: wos-app:dev
    init: true
    profiles: [driver]
    command: ["node", "src/driver/run.ts"]
    environment: { ENGINE: none, STUB_URL: http://stub:8080 }
    volumes: ["../results:/app/results"]
